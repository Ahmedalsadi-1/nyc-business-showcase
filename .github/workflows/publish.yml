name: Publish campaign
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: HTTPS URL of the prepared public campaign ZIP
        required: true
        type: string
      artifact_bytes:
        description: Size of the prepared ZIP in bytes
        required: true
        type: string
      sha256:
        description: SHA-256 of the prepared public campaign ZIP
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the verified public snapshot
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SHA256: ${{ inputs.sha256 }}
          ARTIFACT_BYTES: ${{ inputs.artifact_bytes }}
        run: |
          [[ "$ARTIFACT_BYTES" =~ ^[0-9]+$ ]]
          export PART_SIZE=$(( (ARTIFACT_BYTES + 7) / 8 ))
          seq 0 7 | xargs -P 8 -I __INDEX__ bash -c '
            start=$((__INDEX__ * PART_SIZE))
            end=$((start + PART_SIZE - 1))
            if ((end >= ARTIFACT_BYTES)); then end=$((ARTIFACT_BYTES - 1)); fi
            curl --fail --location --retry 2 --max-time 1200 --range "$start-$end" "$SOURCE_URL" --output "$RUNNER_TEMP/chunk-__INDEX__"
          '
          for part in 0 1 2 3 4 5 6 7; do cat "$RUNNER_TEMP/chunk-$part"; done > "$RUNNER_TEMP/campaign.zip"
          echo "$SHA256  $RUNNER_TEMP/campaign.zip" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/public"
          unzip -q "$RUNNER_TEMP/campaign.zip" -d "$RUNNER_TEMP/public"
          test -f "$RUNNER_TEMP/public/index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
