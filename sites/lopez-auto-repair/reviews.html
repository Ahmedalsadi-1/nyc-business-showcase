<div class="voices"><figure class="voice" data-reveal><div class="voice__who"><div class="voice__av">TJ</div><div><div class="voice__name">TJ Jackson</div><div class="voice__when">9 months ago</div></div></div><div class="stars" aria-label="rating"></div><p>I googled auto centers this morning, looking for a place to get an oil change and this place came up first. When I drove up immediately felt that I did not have my wallet on me and I dreaded having to drive back and the plus the place</p></figure><figure class="voice" data-reveal><div class="voice__who"><div class="voice__av">KA</div><div><div class="voice__name">Kareem Ahmedzay</div><div class="voice__when">7 months ago</div></div></div><div class="stars" aria-label="rating"></div><p>I’m not the type to write reviews but for this I had to. Guy Tried to hit me over the head with pricing. Then charged me $120 for a “diagnostic” just to literally look under my hood for 2 minutes. Just a whole bunch of scammy vibes here. I do NOT recommend! More</p></figure><figure class="voice" data-reveal><div class="voice__who"><div class="voice__av">ZD</div><div><div class="voice__name">Zach Dietsch</div><div class="voice__when">11 months ago</div></div></div><div class="stars" aria-label="rating"></div><p>Lopez is the man. Friendly neighborhood no-frills shop. Everything they recommended to fix was totally necessary and done for a very fair price. Highly recommend. The guy is cool, too.</p></figure></div>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var nav = document.querySelector('.nav');
  var rail = document.querySelector('.rail');
  var hero = document.querySelector('.hero--expand');
  var media = document.querySelector('.hero__media img');
  var copy = document.querySelector('.hero__body');

  function onScroll(){
    var y = window.scrollY;
    if(nav) nav.classList.toggle('solid', y > 40);
    if(rail && !reduce){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      rail.style.transform = 'scaleX(' + (h > 0 ? Math.min(1, y / h) : 0) + ')';
    }
    if(hero && media && !reduce){
      var p = Math.min(1, y / Math.max(1, window.innerHeight));
      media.style.transform = 'scale(' + (1.14 - p * 0.14) + ') translate3d(0,' + (p * 5) + '%,0)';
      if(copy){ copy.style.transform = 'translate3d(0,' + (p * 10) + '%,0)'; copy.style.opacity = String(1 - p * 0.6); }
    }
  }
  onScroll();
  window.addEventListener('scroll', onScroll, {passive:true});

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {threshold:0.12, rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('[data-reveal]').forEach(function(el){ io.observe(el); });
  requestAnimationFrame(function(){
    document.querySelectorAll('.hero [data-reveal]').forEach(function(el){ el.classList.add('in'); });
  });

  document.querySelectorAll('.reel').forEach(function(reel){
    var down = false, start = 0, left = 0;
    reel.addEventListener('pointerdown', function(e){
      down = true; start = e.clientX; left = reel.scrollLeft;
      try { reel.setPointerCapture(e.pointerId); } catch(err){}
    });
    reel.addEventListener('pointermove', function(e){
      if(!down) return;
      reel.scrollLeft = left - (e.clientX - start);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      reel.addEventListener(ev, function(){ down = false; });
    });
  });

  var lb = document.querySelector('.lb');
  if(lb){
    var lbImg = lb.querySelector('img');
    var lbCap = lb.querySelector('p');
    document.querySelectorAll('.reel figure,.deep-photo-grid figure').forEach(function(fig){
      fig.addEventListener('click', function(){
        var img = fig.querySelector('img');
        lbImg.src = img.src; lbImg.alt = img.alt;
        lbCap.textContent = fig.dataset.caption || '';
        lb.classList.add('on'); document.body.style.overflow = 'hidden';
      });
    });
    function close(){ lb.classList.remove('on'); document.body.style.overflow = ''; }
    lb.addEventListener('click', function(e){
      if(e.target === lb || e.target.tagName === 'BUTTON') close();
    });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  }

  var links = [].slice.call(document.querySelectorAll('.navlinks a'));
  var targets = links.map(function(a){ return a.getAttribute('href').startsWith('#') ? document.querySelector(a.getAttribute('href')) : null; });
  if(targets.length && 'IntersectionObserver' in window){
    var spy = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        links.forEach(function(a){ a.classList.remove('on'); });
        var i = targets.indexOf(e.target);
        if(links[i]) links[i].classList.add('on');
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    targets.forEach(function(t){ if(t) spy.observe(t); });
  }
})();
